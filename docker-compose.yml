# Local Postgres for development. Start it with:  docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnishop
      POSTGRES_PASSWORD: omnishop
      POSTGRES_DB: omnishop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnishop -d omnishop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
