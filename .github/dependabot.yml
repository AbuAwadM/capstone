# Keeps the SHA-pinned actions and both lockfiles up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
