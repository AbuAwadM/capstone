# Keeps the SHA-pinned actions and both lockfiles up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet (see README).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Keep Node types on the major version CI and Vercel run (Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
